<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/selector.css">
    <title>CSS selector demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR&display=swap" rel="stylesheet">
</head>
<body>
   
    <!-- 후손 선택자 -->
     <!-- 시멘틱 태그(의미론적 태그) -->
     <section>
        <h3>ul li -- 후손 선택자</h3>
        <ul>
            <li>사과</li>
            <li>배</li>
            <li>수박</li>
        </ul>
     </section>
    <h1>hello</h1>
    <section>
        <a href="https://www.naver.com">네이버</a>
        <a href="https://www.daum.net">카카오</a>
        <a href="https://www.google.com">구글</a>
    </section>
    
    <section>
        <h3>:first-child /:last-child/nth-child(2)</h3>
        <uk class="group-list">
            <li>IVE</li>
            <li>AESPA</li>
            <li>NEWJEANS</li>
        </uk>
    </section>
    <section>
        
    </section>
</body>
</html>
